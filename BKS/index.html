<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>个人记账</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; padding: 20px; background: #f5f5f5; min-height: 100vh; display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; align-items: flex-start; }
  .account { width: 120px; height: 120px; border-radius: 20px; color: #fff; font-size: 18px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; }
  .account::before { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 8px; font-size: 20px; }
  .account::before { content: ""; width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); font-size: 16px; font-weight: bold; }
  #alipay-huabei { background: #00A2EE; }
  #alipay-huabei::before { content: "支"; }
  #wechat-fenfu { background: #07C160; }
  #wechat-fenfu::before { content: "微"; }
  #meituan-credit-card { background: #FAA21C; color: #000; }
  #meituan-credit-card::before { content: "美"; color: #000; }
  #jd-baitiao { background: #E61232; }
  #jd-baitiao::before { content: "京"; }
</style>
</head>
<body>
  <div class="account" id="alipay-huabei">支付宝花呗</div>
  <div class="account" id="wechat-fenfu">微信分付</div>
  <div class="account" id="meituan-credit-card">美团信用卡</div>
  <div class="account" id="jd-baitiao">京东白条</div>
</body>
</html>
