<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#673AB7">
    <title>记账统计 - BKS</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html { font-size: 16px; }
        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            min-height: 100vh;
            color: #212121;
            overflow-x: hidden;
        }
        .app-bar {
            background: #673AB7;
            color: #fff;
            padding: 14px 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }
        .app-bar-title {
            font-size: 18px;
            font-weight: 500;
        }
        .container { max-width: 600px; margin: 0 auto; padding: 16px; }
        .card {
            background: #fff;
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }
        .card-title {
            font-size: 16px;
            font-weight: 500;
            color: #212121;
            margin-bottom: 12px;
        }
        .stats-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-top: 8px;
        }
        .stat-card {
            flex: 1;
            min-width: 100px;
            text-align: center;
            padding: 14px 8px;
            background: #f5f5f5;
            border-radius: 10px;
        }
        .stat-value {
            font-size: 24px;
            font-weight: 700;
            color: #673AB7;
            margin-bottom: 4px;
        }
        .stat-label {
            font-size: 12px;
            color: #757575;
        }
    </style>
</head>
<body>
    <div class="app-bar">
        <span class="app-bar-title">记账统计</span>
    </div>
    <div class="container">
        <!-- 第1行 本月统计 -->
        <div class="card">
            <div class="card-title">本月统计</div>
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value">0</div>
                    <div class="stat-label">工作天数</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">0h</div>
                    <div class="stat-label">总时长</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value">0元</div>
                    <div class="stat-label">总薪资</div>
                </div>
            </div>
        </div>
        <!-- 第2行 本月统计 -->

                <div class="stat-card">

                </div>
            </div>
        </div>
        <!-- 第3行 本月统计 -->

                <div class="stat-card">

                <div class="stat-card">

                <div class="stat-card">
                    <div class="stat-value">0元</div>
                    <div class="stat-label">总薪资</div>
                </div>
            </div>
        </div>
        <!-- 第4行 本月统计 -->

</html>
