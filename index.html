<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人记账</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; background: #f5f5f5; }
  .app { max-width: 390px; margin: 0 auto; background: #fff; min-height: 100vh; display: flex; flex-direction: column; box-shadow: 0 0 20px rgba(0,0,0,0.08); }
  .app-bar { height: 56px; background: #6200ee; color: #fff; display: flex; align-items: center; padding: 0 16px; font-size: 20px; font-weight: 600; }
  .content { padding: 16px; flex: 1; }
  .accounts { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .account { height: 110px; border-radius: 16px; color: #fff; font-size: 16px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; box-sizing: border-box; padding: 12px; }
  .account::before { content: ""; width: 40px; height: 40px; border-radius: 10px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.2); font-size: 18px; font-weight: bold; margin-bottom: 8px; }
  #alipay-huabei { background: #00A2EE; }
  #alipay-huabei::before { content: "支"; }
  #wechat-fenfu { background: #07C160; }
  #wechat-fenfu::before { content: "微"; }
  #meituan-credit-card { background: #FAA21C; color: #000; }
  #meituan-credit-card::before { content: "美"; color: #000; }
  #jd-baitiao { background: #E61232; }
  #jd-baitiao::before { content: "京"; }
  .bottom-nav { height: 56px; background: #fff; border-top: 1px solid #e0e0e0; display: flex; justify-content: space-around; align-items: center; font-size: 12px; color: #666; }
  .bottom-nav .active { color: #6200ee; }
  .nav-item { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
</style>
</head>
<body>
  <div class="app">
    <div class="app-bar">个人记账</div>
    <div class="content">
      <div class="accounts">
        <div class="account" id="alipay-huabei">支付宝花呗</div>
        <div class="account" id="wechat-fenfu">微信分付</div>
        <div class="account" id="meituan-credit-card">美团信用卡</div>
        <div class="account" id="jd-baitiao">京东白条</div>
      </div>
    </div>
    <div class="bottom-nav">
      <div class="nav-item active"><div>🏠</div><div>首页</div></div>
      <div class="nav-item"><div>📝</div><div>记账</div></div>
      <div class="nav-item"><div>📊</div><div>账单</div></div>
      <div class="nav-item"><div>👤</div><div>我的</div></div>
    </div>
  </div>
</body>
</html>
