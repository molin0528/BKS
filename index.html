<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>账单记账</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            huabei: '#1677ff',
            fenfu: '#00b42a',
            credit: '#ff7d00',
            baitiao: '#f53f3f',
            monthPay: '#e53e3e'
          }
        }
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .card-shadow { box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
      .item-shadow { box-shadow: 0 1px 8px rgba(0,0,0,0.05); }
      .icon-bg {
        width: 34px; height: 34px; border-radius: 10px;
        display: flex; align-items: center; justify-content: center;
      }
    }
  </style>
</head>
<body class="bg-slate-50 pb-24">
  <header class="px-4 py-5 flex items-center justify-between">
    <h1 class="text-[22px] font-bold text-gray-800">账单记账</h1>
    <i class="fa fa-bell-o text-gray-400 text-xl"></i>
  </header>

  <!-- 顶部汇总双卡片 -->
  <div class="px-4 grid grid-cols-2 gap-4">
    <div class="bg-white rounded-xl p-5 card-shadow text-center">
      <p class="text-sm text-gray-500">总账单</p>
      <p id="totalDebt" class="text-[32px] font-bold text-gray-800 mt-1">0.00</p>
      <p class="text-xs text-gray-400 mt-1">所有账单合计金额</p>
    </div>
    <div class="bg-white rounded-xl p-5 card-shadow text-center">
      <p class="text-sm text-gray-500">本月总待还</p>
      <p id="monthTotalPay" class="text-[32px] font-bold text-monthPay mt-1">0.00</p>
      <p class="text-xs text-gray-400 mt-1">本月需偿还金额</p>
    </div>
  </div>

  <!-- 账单列表容器 -->
  <div id="debtList" class="px-4 mt-5 space-y-3"></div>

  <!-- 底部按钮 -->
  <div class="px-4 mt-6 grid grid-cols-2 gap-4">
    <button id="btnAddDebt" class="bg-blue-500 text-white py-4 rounded-xl font-medium text-lg">
      <i class="fa fa-plus mr-1"></i>新增账单
    </button>
    <button id="btnViewBill" class="bg-white text-gray-700 py-4 rounded-xl font-medium text-lg border item-shadow">
      <i class="fa fa-calendar mr-1"></i>查看账单
    </button>
  </div>

  <!-- 弹窗：新增/编辑账单 -->
  <div id="mask" class="fixed inset-0 bg-black/45 hidden z-50 flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-sm rounded-xl p-5">
      <h3 id="modalTitle" class="text-lg font-bold mb-4">新增账单</h3>
      <div class="space-y-3">
        <div id="typeRow">
          <label class="text-sm text-gray-600">账单类型</label>
          <div class="mt-1 border border-gray-200 rounded-lg overflow-hidden">
            <div id="typeToggle" class="px-3 py-2 bg-gray-50 flex justify-between items-center cursor-pointer hover:bg-gray-100 transition-colors">
              <span id="selectedTypeName">请选择账单类型</span>
              <i id="typeArrow" class="fa fa-caret-right text-gray-500"></i>
            </div>
            <div id="typePanel" class="hidden">
              <div class="border-t border-gray-100">
                <div class="type-item px-3 py-2 hover:bg-blue-50 cursor-pointer" data-val="huabei">花呗</div>
                <div class="type-item px-3 py-2 hover:bg-green-50 cursor-pointer" data-val="fenfu">分付</div>
                <div class="type-item px-3 py-2 hover:bg-orange-50 cursor-pointer" data-val="credit">信用卡</div>
                <div class="type-item px-3 py-2 hover:bg-red-50 cursor-pointer" data-val="baitiao">白条</div>
              </div>
            </div>
          </div>
          <input type="hidden" id="typeSelectVal">
        </div>
        <div id="addMoneyRow">
          <label class="text-sm text-gray-600">新增金额</label>
          <input id="moneyInput" type="number" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 mt-1 bg-gray-50 hover:bg-gray-100 transition-colors" placeholder="0.00">
        </div>
        <div id="editTotalRow" class="hidden">
          <label class="text-sm text-gray-600">总金额</label>
          <input id="editTotalInput" type="number" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 mt-1 bg-gray-50 hover:bg-gray-100 transition-colors" placeholder="0.00">
        </div>
        <div id="editMonthRow" class="hidden">
          <label class="text-sm text-gray-600">本月待还</label>
          <input id="editMonthInput" type="number" step="0.01" class="w-full border border-gray-200 rounded-lg px-3 py-2 mt-1 bg-gray-50 hover:bg-gray-100 transition-colors" placeholder="0.00">
        </div>
        <div id="editRemarkRow" class="hidden">
          <label class="text-sm text-gray-600">还款日备注</label>
          <input id="editRemarkInput" class="w-full border border-gray-200 rounded-lg px-3 py-2 mt-1 bg-gray-50 hover:bg-gray-100 transition-colors" placeholder="还款日：每月20号">
        </div>
      </div>
      <div class="flex gap-3 mt-6">
        <button id="btnCancel" class="flex-1 py-2 border border-gray-200 rounded-lg text-gray-600 hover:bg-gray-100 transition-colors">取消</button>
        <button id="btnSave" class="flex-1 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">保存</button>
      </div>
    </div>
  </div>

  <!-- ✅ 查看账单（日历 + 当日流水） -->
  <div id="billMask" class="fixed inset-0 bg-black/45 hidden z-50 flex items-center justify-center px-4">
    <div class="bg-white w-full max-w-sm rounded-xl p-4 max-h-[88vh] flex flex-col">
      <!-- 标题栏 -->
      <div class="flex justify-between items-center mb-3">
        <h3 class="text-lg font-bold text-gray-800">账单日历</h3>
        <button id="closeBill" class="text-gray-400 hover:text-gray-600 text-xl">
          <i class="fa fa-times"></i>
        </button>
      </div>

      <!-- 统计条 -->
      <div class="bg-slate-50 rounded-lg px-3 py-2 flex justify-between items-center mb-3 text-sm">
        <span class="text-gray-500">共 <b id="recCount" class="text-gray-800">0</b> 条记录</span>
        <span class="text-gray-500">合计 <b id="recSum" class="text-gray-800">0.00</b></span>
      </div>

      <!-- 日历 -->
      <div class="border border-gray-100 rounded-xl p-2.5">
        <div class="flex justify-between items-center mb-2 px-1">
          <button id="calPrev" class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100">
            <i class="fa fa-angle-left text-lg"></i>
          </button>
          <span id="calTitle" class="font-semibold text-gray-800 text-sm"></span>
          <button id="calNext" class="w-8 h-8 flex items-center justify-center rounded-lg text-gray-500 hover:bg-gray-100">
            <i class="fa fa-angle-right text-lg"></i>
          </button>
        </div>
        <div class="grid grid-cols-7 text-center text-[11px] text-gray-400 mb-1">
          <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
        </div>
        <div id="calGrid" class="grid grid-cols-7 gap-1"></div>
        <div id="calMonthSum" class="text-[11px] text-gray-400 text-center mt-2"></div>
      </div>

      <!-- 当日流水 -->
      <div class="mt-3 flex-1 overflow-y-auto">
        <div id="dayTitle" class="text-sm font-medium text-gray-700 mb-2 px-1"></div>
        <div id="billList" class="space-y-2"></div>
      </div>
    </div>
  </div>

<script>
const typeConfig = {
  huabei: { name: "花呗", remark: "还款日：每月20号", icon: "fa-credit-card", color: "#1677ff" },
  fenfu: { name: "分付", remark: "还款日：每月10号", icon: "fa-wechat", color: "#00b42a" },
  credit: { name: "信用卡", remark: "还款日：每月4号", icon: "fa-bank", color: "#ff7d00" },
  baitiao: { name: "白条", remark: "还款日：每月3号", icon: "fa-shopping-cart", color: "#f53f3f" }
}

let billData = JSON.parse(localStorage.getItem("billData")) || {};
Object.keys(typeConfig).forEach(key=>{
  if(!billData[key]){
    billData[key] = { total: 0, monthPay: 0, remark: typeConfig[key].remark };
  }else if(!billData[key].remark){
    billData[key].remark = typeConfig[key].remark;
  }
})
const initDefault = {
  huabei: { total: 3796.93, monthPay: 1367.82, remark: typeConfig.huabei.remark },
  fenfu:  { total: 3483.18, monthPay: 0.00, remark: typeConfig.fenfu.remark },
  credit: { total: 748.75,  monthPay: 0.00, remark: typeConfig.credit.remark },
  baitiao:{ total: 419.85,  monthPay: 0.00, remark: typeConfig.baitiao.remark }
}
if(Object.keys(billData).length === 0) billData = initDefault;

let billRecords = JSON.parse(localStorage.getItem("billRecords")) || [];

let currentEditKey = null;
let typePanelOpen = false;

// 日历状态
let calYear, calMonth, selectedDate; // selectedDate: "YYYY-MM-DD"

const pad = n => String(n).padStart(2,"0");
const keyOf = (y,m,d) => `${y}-${pad(m+1)}-${pad(d)}`;
const todayKey = () => { const t = new Date(); return keyOf(t.getFullYear(), t.getMonth(), t.getDate()); };

// ===== 折叠选择器 =====
document.getElementById("typeToggle").onclick = function(){
  typePanelOpen = !typePanelOpen;
  const panel = document.getElementById("typePanel");
  const arrow = document.getElementById("typeArrow");
  if(typePanelOpen){
    panel.classList.remove("hidden");
    arrow.className = "fa fa-caret-down text-gray-500";
  }else{
    panel.classList.add("hidden");
    arrow.className = "fa fa-caret-right text-gray-500";
  }
}
document.querySelectorAll(".type-item").forEach(item=>{
  item.onclick = function(e){
    e.stopPropagation();
    const val = this.dataset.val;
    document.getElementById("typeSelectVal").value = val;
    document.getElementById("selectedTypeName").innerText = this.innerText;
    typePanelOpen = false;
    document.getElementById("typePanel").classList.add("hidden");
    document.getElementById("typeArrow").className = "fa fa-caret-right text-gray-500";
  }
})

// ===== 主页渲染 =====
function render() {
  const wrap = document.getElementById("debtList");
  wrap.innerHTML = "";
  let total = 0, sumMonth = 0;
  Object.keys(typeConfig).forEach(key => {
    const cfg = typeConfig[key];
    const item = billData[key];
    total += Number(item.total);
    sumMonth += Number(item.monthPay);
    const div = document.createElement("div");
    div.className = "bg-white rounded-xl p-4 item-shadow flex items-center justify-between";
    div.innerHTML = `
      <div class="flex items-center gap-3">
        <div class="icon-bg" style="background:${cfg.color}15;color:${cfg.color}">
          <i class="fa ${cfg.icon} text-lg"></i>
        </div>
        <div>
          <p class="font-medium text-gray-800">${cfg.name}</p>
          <p class="text-xs text-gray-400">${item.remark}</p>
        </div>
      </div>
      <div class="w-36 text-right">
        <div class="flex justify-between text-sm text-gray-500">
          <span>总金额</span>
          <span class="font-bold" style="color:${cfg.color}">${Number(item.total).toFixed(2)}</span>
        </div>
        <div class="flex justify-between text-sm text-gray-500 mt-1">
          <span>本月待还</span>
          <span class="font-bold text-monthPay">${Number(item.monthPay).toFixed(2)}</span>
        </div>
      </div>
    `;
    div.onclick = () => openEdit(key);
    wrap.appendChild(div);
  })
  document.getElementById("totalDebt").innerText = total.toFixed(2);
  document.getElementById("monthTotalPay").innerText = sumMonth.toFixed(2);
  saveStorage();
}

function saveStorage() {
  localStorage.setItem("billData", JSON.stringify(billData));
  localStorage.setItem("billRecords", JSON.stringify(billRecords));
}

// ===== 新增 / 编辑 =====
function openAdd() {
  currentEditKey = null;
  document.getElementById("modalTitle").innerText = "新增账单";
  document.getElementById("typeRow").classList.remove("hidden");
  document.getElementById("addMoneyRow").classList.remove("hidden");
  document.getElementById("editTotalRow").classList.add("hidden");
  document.getElementById("editMonthRow").classList.add("hidden");
  document.getElementById("editRemarkRow").classList.add("hidden");

  document.getElementById("selectedTypeName").innerText = "请选择账单类型";
  document.getElementById("typeSelectVal").value = "";
  typePanelOpen = false;
  document.getElementById("typePanel").classList.add("hidden");
  document.getElementById("typeArrow").className = "fa fa-caret-right text-gray-500";

  document.getElementById("moneyInput").value = "";
  document.getElementById("mask").classList.remove("hidden");
}

function openEdit(typeKey) {
  currentEditKey = typeKey;
  document.getElementById("modalTitle").innerText = "编辑账单";
  document.getElementById("typeRow").classList.add("hidden");
  document.getElementById("addMoneyRow").classList.add("hidden");
  document.getElementById("editTotalRow").classList.remove("hidden");
  document.getElementById("editMonthRow").classList.remove("hidden");
  document.getElementById("editRemarkRow").classList.remove("hidden");

  const item = billData[typeKey];
  document.getElementById("editTotalInput").value = item.total;
  document.getElementById("editMonthInput").value = item.monthPay;
  document.getElementById("editRemarkInput").value = item.remark;
  document.getElementById("mask").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("mask").classList.add("hidden");
}

function formatTime(d){
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

function saveItem() {
  if (currentEditKey === null) {
    const type = document.getElementById("typeSelectVal").value;
    const addMoney = Number(document.getElementById("moneyInput").value);
    if (!type || isNaN(addMoney) || addMoney <= 0) {
      alert("请选择账单类型并填写合法金额");
      return;
    }
    billData[type].total = Number(billData[type].total) + addMoney;

    const now = new Date();
    billRecords.push({
      id: Date.now() + "_" + Math.random().toString(36).slice(2,7),
      type: type,
      amount: addMoney,
      time: formatTime(now),
      dateKey: keyOf(now.getFullYear(), now.getMonth(), now.getDate())
    });

    // 新记录落地到当天
    calYear = now.getFullYear();
    calMonth = now.getMonth();
    selectedDate = todayKey();

  } else {
    const newTotal = Number(document.getElementById("editTotalInput").value);
    const newMonth = Number(document.getElementById("editMonthInput").value);
    const newRemark = document.getElementById("editRemarkInput").value.trim();
    if (isNaN(newTotal) || newTotal < 0 || isNaN(newMonth) || newMonth < 0) {
      alert("请填写合法金额");
      return;
    }
    billData[currentEditKey].total = newTotal;
    billData[currentEditKey].monthPay = newMonth;
    billData[currentEditKey].remark = newRemark;
  }
  closeModal();
  render();
}

// ===== 流水按日期分组（兼容旧数据，没有 dateKey 就从 time 里取） =====
function getDateKey(r){
  if(r.dateKey) return r.dateKey;
  if(r.time) return r.time.substring(0,10);
  return "";
}

function recordsByDate(){
  const map = {};
  billRecords.forEach(r=>{
    const k = getDateKey(r);
    if(!k) return;
    (map[k] = map[k] || []).push(r);
  })
  return map;
}

// ===== 打开查看账单 =====
function openViewBill() {
  // 默认定位到今天；若本月无记录但有历史记录，跳到最近一条所在月份
  const t = new Date();
  calYear = t.getFullYear();
  calMonth = t.getMonth();
  selectedDate = todayKey();

  const map = recordsByDate();
  const hasThisMonth = Object.keys(map).some(k => k.startsWith(`${calYear}-${pad(calMonth+1)}`));
  if(!hasThisMonth && billRecords.length > 0){
    let latest = "";
    billRecords.forEach(r=>{ const k = getDateKey(r); if(k > latest) latest = k; });
    if(latest && latest.length >= 7){
      calYear = Number(latest.substring(0,4));
      calMonth = Number(latest.substring(5,7)) - 1;
      selectedDate = latest;
    }
  }

  renderCalendar();
  document.getElementById("billMask").classList.remove("hidden");
}

// ===== 日历渲染 =====
function renderCalendar(){
  const map = recordsByDate();
  document.getElementById("calTitle").innerText = `${calYear}年${calMonth+1}月`;

  // 顶部总统计
  const sumAll = billRecords.reduce((s,r)=> s + Number(r.amount), 0);
  document.getElementById("recCount").innerText = billRecords.length;
  document.getElementById("recSum").innerText = "¥" + sumAll.toFixed(2);

  // 本月合计
  let monthSum = 0, monthCnt = 0;
  Object.keys(map).forEach(k=>{
    if(k.startsWith(`${calYear}-${pad(calMonth+1)}`)){
      map[k].forEach(r=>{ monthSum += Number(r.amount); monthCnt++; });
    }
  })
  document.getElementById("calMonthSum").innerText =
    monthCnt > 0 ? `本月 ${monthCnt} 笔，合计 ¥${monthSum.toFixed(2)}` : "本月暂无账单记录";

  const grid = document.getElementById("calGrid");
  grid.innerHTML = "";

  const firstWeekday = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();

  const cells = [];
  for(let i = firstWeekday - 1; i >= 0; i--) cells.push({ day: daysInPrev - i, cur: false });
  for(let d = 1; d <= daysInMonth; d++) cells.push({ day: d, cur: true });
  let tail = (7 - (cells.length % 7)) % 7;
  if(cells.length % 7 !== 0) tail = 7 - (cells.length % 7);
  for(let i = 1; i <= tail; i++) cells.push({ day: i, cur: false });

  cells.forEach(c=>{
    const cell = document.createElement("div");
    if(!c.cur){
      cell.className = "h-12 flex flex-col items-center justify-center rounded-lg text-[11px] text-gray-300";
      cell.innerHTML = `<span class="text-xs">${c.day}</span>`;
      grid.appendChild(cell);
      return;
    }
    const k = keyOf(calYear, calMonth, c.day);
    const list = map[k] || [];
    const daySum = list.reduce((s,r)=> s + Number(r.amount), 0);
    const isToday = k === todayKey();
    const isSelected = k === selectedDate;

    let cls = "h-12 flex flex-col items-center justify-center rounded-lg cursor-pointer relative transition-colors ";
    if(isSelected){
      cls += "bg-blue-500 text-white";
    }else{
      cls += "text-gray-700 hover:bg-gray-100";
    }

    let amtHtml = "";
    if(list.length > 0){
      if(isSelected) amtHtml = `<span class="text-[10px] mt-0.5">${list.length}笔</span>`;
      else amtHtml = `<span class="text-[10px] text-monthPay mt-0.5 font-medium">¥${daySum >= 1000 ? (daySum/1000).toFixed(1)+'k' : daySum.toFixed(0)}</span>`;
    }else{
      amtHtml = `<span class="text-[10px] mt-0.5 opacity-0">0</span>`;
    }

    cell.className = cls;
    cell.innerHTML = `
      <span class="text-xs leading-none ${isToday && !isSelected ? 'font-bold text-blue-500' : ''}">${c.day}</span>
      ${amtHtml}
    `;
    cell.onclick = ()=>{
      selectedDate = k;
      renderCalendar();
    };
    grid.appendChild(cell);
  });

  renderDayRecords();
}

// ===== 当日流水 =====
function renderDayRecords(){
  const map = recordsByDate();
  const list = (map[selectedDate] || []).slice().reverse();
  const titleEl = document.getElementById("dayTitle");
  const wrap = document.getElementById("billList");

  const parts = selectedDate.split("-");
  const daySum = list.reduce((s,r)=> s + Number(r.amount), 0);
  titleEl.innerHTML = `${Number(parts[1])}月${Number(parts[2])}日 流水
    <span class="text-gray-400 font-normal ml-1">${list.length} 笔 · ¥${daySum.toFixed(2)}</span>`;

  wrap.innerHTML = "";
  if(list.length === 0){
    wrap.innerHTML = `
      <div class="text-center text-gray-400 py-6 text-xs">
        <i class="fa fa-calendar-o text-2xl mb-2 block text-gray-300"></i>
        这天暂无账单记录
      </div>`;
    return;
  }

  list.forEach(r=>{
    const cfg = typeConfig[r.type] || { name:"其他", icon:"fa-file-text-o", color:"#909399" };
    const timeOnly = (r.time || "").substring(11) || "--:--";
    wrap.innerHTML += `
      <div class="bg-slate-50 rounded-xl p-3 flex items-center gap-3">
        <div class="icon-bg flex-shrink-0" style="background:${cfg.color}15;color:${cfg.color}">
          <i class="fa ${cfg.icon}"></i>
        </div>
        <div class="flex-1 min-w-0">
          <div class="flex justify-between items-center">
            <span class="font-medium text-gray-800 text-sm">${cfg.name}</span>
            <span class="font-bold text-sm" style="color:${cfg.color}">+¥${Number(r.amount).toFixed(2)}</span>
          </div>
          <div class="flex justify-between items-center mt-1">
            <span class="text-xs text-gray-400">${timeOnly}</span>
            <button onclick="delRecord('${r.id}')" class="text-xs text-gray-400 hover:text-red-500 px-1">
              <i class="fa fa-trash-o mr-1"></i>删除
            </button>
          </div>
        </div>
      </div>
    `;
  });
}

// 删除流水：同步回退总额
function delRecord(id){
  if(!confirm("删除这条记录？对应总额也会同步减少")) return;
  const idx = billRecords.findIndex(r => r.id === id);
  if(idx === -1) return;
  const r = billRecords[idx];
  billData[r.type].total = Math.max(0, Number(billData[r.type].total) - Number(r.amount));
  billRecords.splice(idx,1);
  render();
  renderCalendar();
}

function closeBillMask() {
  document.getElementById("billMask").classList.add("hidden");
}

// 月份切换
document.getElementById("calPrev").onclick = ()=>{
  calMonth--;
  if(calMonth < 0){ calMonth = 11; calYear--; }
  const map = recordsByDate();
  const monthPrefix = `${calYear}-${pad(calMonth+1)}`;
  const firstKey = Object.keys(map).filter(k=>k.startsWith(monthPrefix)).sort()[0];
  selectedDate = firstKey || `${monthPrefix}-01`;
  renderCalendar();
}
document.getElementById("calNext").onclick = ()=>{
  calMonth++;
  if(calMonth > 11){ calMonth = 0; calYear++; }
  const map = recordsByDate();
  const monthPrefix = `${calYear}-${pad(calMonth+1)}`;
  const firstKey = Object.keys(map).filter(k=>k.startsWith(monthPrefix)).sort()[0];
  selectedDate = firstKey || `${monthPrefix}-01`;
  renderCalendar();
}

// 绑定事件
document.getElementById("btnAddDebt").onclick = openAdd;
document.getElementById("btnCancel").onclick = closeModal;
document.getElementById("btnSave").onclick = saveItem;
document.getElementById("btnViewBill").onclick = openViewBill;
document.getElementById("closeBill").onclick = closeBillMask;
document.getElementById("mask").onclick = (e) => { if (e.target.id === "mask") closeModal() }
document.getElementById("billMask").onclick = (e) => { if (e.target.id === "billMask") closeBillMask() }

render();
</script>
